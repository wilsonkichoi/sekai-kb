# wrangler.toml — the chat Worker's deploy template. Instance identity is generated
# from place.config.ts into the gitignored wrangler.generated.toml.

name = "REPLACE_VIA_NPM_RUN_WORKER_CONFIG"
main = "src/index.mjs"
compatibility_date = "2026-08-07"

[vars]
ALLOWED_ORIGIN = ""
SITE_NAME = ""
RATE_LIMIT_MAX = "20"
RATE_LIMIT_WINDOW_SECONDS = "3600"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_VIA_NPM_RUN_WORKER_CONFIG"
database_id = "REPLACE_VIA_NPM_RUN_WORKER_CONFIG"
migrations_dir = "migrations"
