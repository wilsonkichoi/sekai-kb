name: Deploy to GitHub Pages

# Genericity + build run on every PR and every push to main; deploy runs only on
# push to main. This is the CI that drives every subsequent task's PR to green
# (SPEC §Negative requirements) and the structural genericity gate (ADR 002).
# The fork's deploy.yml is structural reference only — no OG/Playwright/i18n jobs
# (the scaffold has no content pipeline yet; those arrive with the pages that need
# them in later phases).

on:
  push:
    branches: [main]
    tags: ['sekai-kb-v*']
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default. Only the deploy job gets the Pages
# write + OIDC scopes, so the genericity/build jobs — which execute PR-authored
# code (npm ci postinstall, npm run build) — cannot touch Pages or mint tokens.
permissions:
  contents: read

# One in-flight run per ref. On a PR, a new push cancels the superseded build
# (save CI minutes). On main, cancel-in-progress is false so a rapid second push
# never kills an in-flight production deploy; runs queue instead. The
# github-pages environment gives the final deploy-race protection.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  genericity:
    name: Genericity + English-only gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check for place-specific strings in src/, scripts/, tests/, .agents/skills/
        run: bash scripts/ci/check-genericity.sh
      - name: Check for CJK codepoints (English-only) in src/, scripts/, tests/, workers/, .agents/skills/
        run: node scripts/ci/check-english-only.mjs
      - name: Scan-root scope statements match both gates' SCAN_ROOTS
        run: node scripts/ci/check-scan-root-docs.mjs
      - name: Version ownership contract
        run: npm run version:check
      - name: Self-test — both gates scan .agents/skills/ in instance mode
        run: bash scripts/ci/check-skills-gated.sh
      - name: Self-test — the scan-root docs guard fails on doc, script, and anchor drift
        run: bash scripts/ci/check-scan-root-docs-selftest.sh

  test:
    name: Test
    needs: genericity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: npm ci --force
      - run: npm run test:ci
      - run: npm run framework-release:selftest
      - run: npm run article-health:test
      - run: npm run article-health -- --all --profile=ci-deploy
      - name: Dev-plugin action references match the declared release
        run: npm run dev-plugin:check
      # Dev-plugin rule registry: assert every rule under rules_dir is tier-classified
      # (project-bootstrap discovery contract). The dev plugin ships the checker, so
      # this repository vendors none: the composite action runs the copy of
      # resolve_project_rules.py --check that shipped with the tag it is pinned at.
      # Pin an immutable dev-vX.Y.Z release tag — never `main`, never a moving major.
      # The action detects .agent-toolkit/dev.md itself and skips with exit 0 when it
      # is absent, so no `if [ -f ... ]` guard is needed for an adopter stripped by
      # `npm run init`; the init-check job below proves that on a real stripped tree.
      - name: Rule registry
        uses: wilsonkichoi/agent-toolkit/.github/actions/check-rules@dev-v0.0.72
      # Non-vacuity, in place of the retired check-rule-registry.mjs --selftest. The
      # upstream repository-validation job proves the checker's own contract; this
      # proves THIS workflow's wiring of it still fails a deliberately unclassified
      # rule file, so the step above can never pass vacuously.
      #
      # Guarded on dev-plugin state, unlike the `Rule registry` step itself. This
      # workflow is framework-owned and ships to every adopter on upgrade, and an
      # adopter stripped by `npm run init` has no rules to guard: for them these three
      # steps would install uv and couple their CI to an upstream diagnostic string in
      # order to prove the wiring of a step that can only ever skip. The guard is on
      # the proof, never on the gate.
      - name: Rule registry self-test fixture
        if: hashFiles('.agent-toolkit/dev.md') != ''
        env:
          FIXTURE: ${{ runner.temp }}/check-rules-unclassified
        run: |
          set -euo pipefail
          mkdir -p "$FIXTURE/.agent-toolkit/rules"
          printf 'Fixture project instructions.\n' >"$FIXTURE/AGENTS.md"
          printf -- '---\ncontext_file: AGENTS.md\nrules_dir: .agent-toolkit/rules/\n---\n\n## Rules\n\nFixture.\n' \
            >"$FIXTURE/.agent-toolkit/dev.md"
          printf 'No tier frontmatter, so rule discovery must hard-stop here.\n' \
            >"$FIXTURE/.agent-toolkit/rules/unclassified.md"
      - name: Rule registry self-test (must fail)
        id: rules-selftest
        if: hashFiles('.agent-toolkit/dev.md') != ''
        continue-on-error: true
        uses: wilsonkichoi/agent-toolkit/.github/actions/check-rules@dev-v0.0.72
        with:
          path: ${{ runner.temp }}/check-rules-unclassified
      - name: Rule registry self-test verdict
        if: hashFiles('.agent-toolkit/dev.md') != ''
        env:
          OUTCOME: ${{ steps.rules-selftest.outcome }}
          RESULT: ${{ steps.rules-selftest.outputs.result }}
          STATUS: ${{ steps.rules-selftest.outputs.status }}
          REPORT: ${{ steps.rules-selftest.outputs.report }}
        run: |
          set -euo pipefail
          fail() { echo "rule-registry self-test FAILED: $*" >&2; exit 1; }
          [ "$OUTCOME" = failure ] || fail "expected the fixture step to fail, got '$OUTCOME'"
          [ "$RESULT" = checked ] || fail "expected result 'checked', got '$RESULT'"
          [ "$STATUS" = 1 ] || fail "expected status '1', got '$STATUS'"
          case "$REPORT" in
            *"rules_dir contains unclassified Markdown"*) ;;
            *) fail "report does not name the unclassified-rule diagnostic: $REPORT" ;;
          esac
          case "$REPORT" in
            *".agent-toolkit/rules/unclassified.md"*) ;;
            *) fail "report does not name the offending file: $REPORT" ;;
          esac
          echo "rule-registry self-test OK: the pinned action rejects an unclassified rule file."
      # Upgrade determinism: a framework tag merge must preserve the instance's
      # dev-plugin state — stripped stays stripped on shared AND unrelated history,
      # installed keeps its adopter-owned config byte-for-byte, and either
      # inconsistent state stops the upgrade (ADR 006 addendum). The harness builds
      # disposable git repos and drives the same scripts/upgrade/ helper users run,
      # so it is framework-owned and never guarded away on an adopter.
      - name: Upgrade dev-plugin state regressions
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          npm run upgrade:check
          npm run upgrade:selftest
          npm run upgrade:package-selftest

  build:
    name: Build
    needs: [genericity, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # --force: astro 6.4.8's @rolldown/binding-wasm32-wasi declares optional
      # @emnapi/* sub-deps. npm 10.x's `npm ci` validates these across ALL
      # platforms in the lockfile (even those skipped on the current OS). When the
      # lock was generated on macOS, it records the macOS-resolved versions; CI
      # (ubuntu) resolves a newer patch and rejects the lock. --force bypasses
      # that cross-platform validation; the build still uses exact locked versions
      # for all non-optional deps. Remove when npm ships the fix for nodejs/npm#7758.
      - run: npm ci --force
      - run: npm run build
      # Only publish the artifact when we intend to deploy (push to main); PR
      # builds verify the build compiles but produce nothing to deploy.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  init-check:
    name: Init wizard self-check
    needs: genericity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # --force: same lockfile cross-platform validation issue as the build job.
      - run: npm ci --force
      # --build is destructive by design (runs init in this checkout, then a
      # full build on the initialized instance); the CI checkout is disposable.
      - name: Init self-check (double-init byte-diff, seeded files, local denylist gate, init → build)
        run: bash scripts/init/check-init.sh --build
      # The step above ran the wizard in place, so this workspace IS a stripped
      # adopter tree: no .agent-toolkit/ at all. Run the same rules-contract action
      # the test job runs and prove it skips cleanly there, rather than assuming it
      # from the action's documentation.
      - name: Rule registry on the stripped instance
        id: rules-stripped
        uses: wilsonkichoi/agent-toolkit/.github/actions/check-rules@dev-v0.0.72
      - name: Rule registry stripped-instance verdict
        env:
          OUTCOME: ${{ steps.rules-stripped.outcome }}
          RESULT: ${{ steps.rules-stripped.outputs.result }}
          STATUS: ${{ steps.rules-stripped.outputs.status }}
          REPORT: ${{ steps.rules-stripped.outputs.report }}
        run: |
          set -euo pipefail
          fail() { echo "stripped-instance rules check FAILED: $*" >&2; exit 1; }
          # Non-vacuous only because the wizard really removed the tree.
          [ ! -e .agent-toolkit ] || fail ".agent-toolkit/ survived the wizard; this is not a stripped tree"
          [ "$OUTCOME" = success ] || fail "expected success, got '$OUTCOME'"
          [ "$RESULT" = skipped ] || fail "expected result 'skipped', got '$RESULT'"
          [ "$STATUS" = 0 ] || fail "expected status '0', got '$STATUS'"
          case "$REPORT" in
            *"no .agent-toolkit/dev.md"*) ;;
            *) fail "report does not carry the skip message: $REPORT" ;;
          esac
          echo "stripped-instance rules check OK: skipped with exit 0 on a tree the wizard stripped."

  deploy:
    name: Deploy to Pages
    needs: [build, init-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Write scopes live here only (see top-level note): actions/deploy-pages needs
    # id-token: write for OIDC and pages: write to publish.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
