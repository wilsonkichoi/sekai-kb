[project]
name = "sekai-kb-tools"
version = "0.0.0"
description = "Python tooling for a sekai-kb knowledge base (article-health)."
requires-python = ">=3.12"
dependencies = [
    "google-analytics-data>=0.23.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
